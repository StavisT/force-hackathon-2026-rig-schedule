*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 16px 8px;max-width:1400px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px;color:var(--ink2)}
.sub{color:var(--ink2);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
nav{display:flex;flex-wrap:wrap;gap:4px;max-width:1400px;margin:0 auto;padding:0 16px}
nav button{border:none;background:none;padding:7px 10px;border-radius:6px;color:var(--ink2);cursor:pointer}
nav button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
main{max-width:1400px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .k{color:var(--ink2);font-size:12px}.tile .v{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}.tile .d{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink2);font-weight:600;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right}
.scroll{overflow:auto;max-height:520px}
.pos{color:var(--good)}.neg{color:var(--bad)}.warnc{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:6px 0}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:3px 0}
#tip{position:fixed;pointer-events:none;z-index:10;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;max-width:320px}
#tip b{font-weight:600}
.gwrap{overflow-x:auto}
svg text{fill:var(--ink2);font-size:11px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--ink2)}
[hidden]{display:none!important}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}.tile .v{font-size:18px}}
</style>

<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const META = D.meta;
const TABS = [["overview","Overview"],["gantt","Gantt"],["economics","Economics"],["util","Utilization"],["expl","Exploration"],["weather","Weather"],["batch","Campaigns"],["uns","Unscheduled"],["risk","Risk"],["diff","Changes"]];
let cur = 0, tab = "overview";
const $ = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); } for (const c of kids) e.append(c); return e; };
const NS = "http://www.w3.org/2000/svg";
const S = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
const V = () => D.variants[cur];
const MU = () => V().kpis.money_unit;
const fM = x => (x == null ? "–" : (x / 1e6).toLocaleString("en", {maximumFractionDigits: 1}) + " M");
const fB = x => (x / 1e9).toLocaleString("en", {maximumFractionDigits: 2}) + " bn";
const fN = (x, d = 0) => x == null ? "–" : Number(x).toLocaleString("en", {maximumFractionDigits: d});
const dayMs = 86400000, toT = s => Date.parse(s + "T00:00:00Z");
const ASSETS = [...new Set(D.variants.flatMap(v => v.schedule.map(r => r[5])))].sort();
const acol = a => `var(--s${(ASSETS.indexOf(a) % 8) + 1})`;
const tip = document.getElementById("tip");
function showTip(ev, lines) { tip.replaceChildren(...lines.map((l, i) => { const d = $("div"); if (i === 0) d.append($("b", {text: l})); else d.textContent = l; return d; })); tip.style.display = "block"; moveTip(ev); }
function moveTip(ev) { const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14; if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + h > innerHeight - 8) y = ev.clientY - h - 14; tip.style.left = x + "px"; tip.style.top = y + "px"; }
function hideTip() { tip.style.display = "none"; }
function hover(el, lines) { el.addEventListener("mouseenter", e => showTip(e, lines())); el.addEventListener("mousemove", moveTip); el.addEventListener("mouseleave", hideTip); }

function table(cols, rows, opts = {}) {
  const t = $("table"); const tr = $("tr");
  for (const c of cols) tr.append($("th", {class: c.n ? "n" : "", text: c.h}));
  t.append($("thead", {}, tr)); const tb = $("tbody");
  for (const r of rows) { const row = $("tr"); for (const c of cols) { const v = c.f ? c.f(r) : r[c.k]; const td = $("td", {class: (c.n ? "n " : "") + (c.cls ? c.cls(r) : "")}); td.textContent = v == null ? "" : String(v); row.append(td); } tb.append(row); }
  t.append(tb); const w = $("div", {class: "scroll"}); w.append(t); return w;
}
function card(title, ...kids) { const c = $("div", {class: "card"}); if (title) c.append($("h2", {text: title})); c.append(...kids); return c; }
function tile(k, v, d, cls) { const t = $("div", {class: "tile"}); t.append($("div", {class: "k", text: k}), $("div", {class: "v " + (cls || ""), text: v})); if (d) t.append($("div", {class: "d", text: d})); return t; }

// ---------------------------------------------------------------- header
const sel = document.getElementById("vsel");
D.variants.forEach((v, i) => sel.append($("option", {value: i, text: v.kpis.name + (v.kpis.name === "reference" ? " (last approved)" : " – " + v.kpis.optimization_freedom)})));
sel.addEventListener("change", () => { cur = +sel.value; render(); });
const tabs = document.getElementById("tabs");
for (const [id, name] of TABS) { const b = $("button", {role: "tab", "aria-selected": id === tab ? "true" : "false", text: name}); b.addEventListener("click", () => { tab = id; for (const x of tabs.children) x.setAttribute("aria-selected", x === b ? "true" : "false"); render(); }); tabs.append(b); }

function render() {
  const v = V(), k = v.kpis;
  document.getElementById("subtitle").textContent = `Dataset ${META.dataset} · plan start ${k.plan_start} · frozen until ${k.freeze_end} (${k.frozen_months} months) · horizon to ${k.horizon_end} · values pre-tax in ${k.money_unit} (${k.unit_set})`;
  document.getElementById("vnote").textContent = k.name === "reference" ? "Greedy baseline as supplied (does not try to meet exploration targets)" : `Optimization freedom: ${k.optimization_freedom} · seed ${k.seed} · run ${k.runtime_s} s`;
  const m = document.getElementById("main"); m.replaceChildren();
  ({overview, gantt, economics, util, expl, weather, batch, uns, risk, diff})[tab](m, v);
}

// ---------------------------------------------------------------- overview
function overview(m, v) {
  const k = v.kpis, ref = D.variants[D.variants.length - 1].kpis;
  const t = $("div", {class: "tiles"});
  const dv = k.portfolio_value - ref.portfolio_value;
  t.append(tile("Portfolio value (NPV + EMV)", fB(k.portfolio_value) + " " + k.money_unit, k.name === "reference" ? "" : (dv >= 0 ? "+" : "") + fM(dv) + " vs reference", ""));
  t.append(tile("Wells scheduled", fN(k.wells_scheduled), `${k.wells_frozen} frozen · ${k.wells_unscheduled} not scheduled`));
  t.append(tile("Exploration targets", k.exploration_target_deviation === 0 ? "All met" : `${k.exploration_target_deviation} off`, "wells outside yearly min–max", k.exploration_target_deviation ? "neg" : "pos"));
  t.append(tile("Mandatory / strategic", k.missing_mandatory === 0 ? "All placed" : `${k.missing_mandatory} missing`, "in their windows", k.missing_mandatory ? "neg" : "pos"));
  t.append(tile("Winter penalty", fM(k.winter_penalty) + " " + k.money_unit, "share of rig day cost × weather-added days"));
  t.append(tile("Sailing / idle rig-days", `${fN(k.sail_days)} / ${fN(k.idle_days)}`, "after the frozen period"));
  m.append(t);
  // variants
  const rows = D.variants.map(x => x.kpis);
  m.append(card("Schedule variants", table([
    {h: "Variant", k: "name"}, {h: "Freedom", k: "optimization_freedom"},
    {h: `Value (M ${k.money_unit})`, n: 1, f: r => fN(r.portfolio_value / 1e6, 1)},
    {h: "Δ vs reference", n: 1, f: r => (r.portfolio_value - ref.portfolio_value >= 0 ? "+" : "") + fN((r.portfolio_value - ref.portfolio_value) / 1e6, 1), cls: r => r.portfolio_value >= ref.portfolio_value ? "pos" : "neg"},
    {h: "Wells", n: 1, k: "wells_scheduled"}, {h: "Changed vs ref.", n: 1, k: "changed_vs_reference"},
    {h: "Target dev.", n: 1, k: "exploration_target_deviation"}, {h: "Winter pen. (M)", n: 1, f: r => fN(r.winter_penalty / 1e6, 1)},
    {h: "Sail days", n: 1, k: "sail_days"}], rows)));
  const inf = $("ul", {class: "plain"});
  (v.infeasibility.length ? v.infeasibility : ["None: all mandatory and strategic wells are placed in their windows, and exploration targets are met."]).forEach(s => inf.append($("li", {text: s})));
  const bn = $("ul", {class: "plain"}); v.bottlenecks.forEach(s => bn.append($("li", {text: s})));
  const g = $("div", {class: "two"}); g.append(card("Infeasibility report", inf), card("Bottlenecks", bn)); m.append(g);
  const ba = Object.entries(v.economics.by_asset).sort((a, b) => b[1] - a[1]);
  m.append(card("Value by asset", barList(ba.map(([a, x]) => [a, x, acol(a)]), k.money_unit)));
}
function barList(items, unit) {
  const w = $("div"); const max = Math.max(...items.map(x => Math.abs(x[1])), 1);
  for (const [name, val, col] of items) {
    const row = $("div", {style: "display:grid;grid-template-columns:140px 1fr 110px;gap:8px;align-items:center;margin:4px 0"});
    const track = $("div", {style: "height:14px;position:relative"});
    const b = $("div", {style: `position:absolute;left:0;top:0;bottom:0;width:${Math.max(0.5, Math.abs(val) / max * 100)}%;background:${val < 0 ? "var(--bad)" : col};border-radius:0 4px 4px 0`});
    track.append(b); hover(b, () => [name, fM(val) + " " + unit]);
    row.append($("div", {text: name}), track, $("div", {class: "n", style: "text-align:right", text: fM(val)}));
    w.append(row);
  }
  return w;
}

// ---------------------------------------------------------------- gantt
function gantt(m, v) {
  const c = card("Rig schedule");
  const leg = $("div", {class: "legend"});

  leg.append($("span", {}, $("span", {class: "sw", style: "background:var(--unavail)"}), document.createTextNode("unavailable / off contract")));

  leg.append($("span", {}, $("span", {class: "sw", style: "height:2px;background:var(--ink2)"}), document.createTextNode("sailing")));

  const wrap = $("div", {class: "gwrap"}); c.append(wrap); m.append(c);
  const draw = () => {

    const t0 = toT(V().kpis.plan_start) - 60 * dayMs, t1 = toT(V().kpis.horizon_end) + 30 * dayMs;
    const x = t => left + (t - t0) / (t1 - t0) * (W - left - 10);

    const svg = S("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Gantt chart of wells per rig"});
    const defs = S("defs"); const pat = S("pattern", {id: "hatch", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"});
    pat.append(S("rect", {width: 2.2, height: 6, fill: "rgba(255,255,255,.55)"})); defs.append(pat); svg.append(defs);
    const y0 = new Date(t0).getUTCFullYear(), y1 = new Date(t1).getUTCFullYear();
    for (let y = y0; y <= y1; y++) {
      for (const mo of META.winter_months) { const a = Date.UTC(y, mo - 1, 1), b = Date.UTC(y, mo, 1); if (b < t0 || a > t1) continue; svg.append(S("rect", {x: x(Math.max(a, t0)), y: top, width: Math.max(0, x(Math.min(b, t1)) - x(Math.max(a, t0))), height: H - top - 10, fill: "var(--winter)"})); }
      const a = Date.UTC(y, 0, 1); if (a >= t0 && a <= t1) { svg.append(S("line", {x1: x(a), x2: x(a), y1: top - 4, y2: H - 10, stroke: "var(--line)"})); const tx = S("text", {x: x(a) + 3, y: 14}); tx.textContent = y; svg.append(tx); }
    }
    const fz = toT(V().kpis.freeze_end); svg.append(S("line", {x1: x(fz), x2: x(fz), y1: top - 6, y2: H - 10, stroke: "var(--ink)", "stroke-dasharray": "4 3"}));
    const ft = S("text", {x: x(fz) + 4, y: top - 8}); ft.textContent = "end of frozen period"; svg.append(ft);
    rigs.forEach((r, i) => {
      const yy = top + i * rowH;
      svg.append(S("line", {x1: left, x2: W - 10, y1: yy + rowH, y2: yy + rowH, stroke: "var(--grid)"}));
      const lab = S("text", {x: 6, y: yy + 15}); lab.textContent = r.rig_id + " " + r.name; svg.append(lab);
      const l2 = S("text", {x: 6, y: yy + 28, style: "font-size:10px;fill:var(--muted)"}); l2.textContent = r.rig_type + (r.capabilities.includes("HPHT") ? " · HPHT" : "") + (r.capabilities.includes("WELL_TEST") ? " · test" : ""); svg.append(l2);
      const off = [[t0, toT(r.contract_start)], [toT(r.contract_end), t1]].concat(r.unavailability.map(u => [toT(u.start), toT(u.end)]));
      for (const [a, b] of off) { if (b <= t0 || a >= t1 || b <= a) continue; const g = S("rect", {x: x(Math.max(a, t0)), y: yy + 6, width: x(Math.min(b, t1)) - x(Math.max(a, t0)), height: rowH - 12, fill: "var(--unavail)", rx: 2}); svg.append(g); const u = r.unavailability.find(q => toT(q.start) === a); hover(g, () => [r.rig_id + (u ? " – " + u.reason : " – off contract"), new Date(a).toISOString().slice(0, 10) + " → " + new Date(b).toISOString().slice(0, 10)]); }
    });
    const ri = Object.fromEntries(rigs.map((r, i) => [r.rig_id, i]));
    for (const s of V().schedule) {
      const [wid, ph, rig, sd, ed, asset, cat, tier, base, eff, sail, frozen, val, purpose] = s;
      const i = ri[rig]; const yy = top + i * rowH; const a = toT(sd), b = toT(ed);
      if (b < t0) continue;
      if (sail > 0) svg.append(S("line", {x1: x(a - sail * dayMs), x2: x(a), y1: yy + rowH / 2, y2: yy + rowH / 2, stroke: "var(--ink2)", "stroke-width": 2}));
      const th = ph === "top_hole"; const hgt = th ? 10 : rowH - 12; const yb = yy + (rowH - hgt) / 2;
      const g = S("g");
      const rect = S("rect", {x: x(Math.max(a, t0)), y: yb, width: Math.max(1.5, x(b) - x(Math.max(a, t0)) - 1), height: hgt, fill: acol(asset), rx: 3});
      g.append(rect);
      if (frozen) g.append(S("rect", {x: x(Math.max(a, t0)), y: yb, width: Math.max(1.5, x(b) - x(Math.max(a, t0)) - 1), height: hgt, fill: "url(#hatch)", rx: 3}));
      if (cat !== "development") { const cx = x(a) + 6; g.append(S("path", {d: `M${cx} ${yy + 4} l4 4 l-4 4 l-4 -4z`, fill: "var(--ink)"})); }
      if (eff > base + 0.5) g.append(S("rect", {x: x(b) - (eff - base) / (eff) * (x(b) - x(a)), y: yb + hgt - 3, width: (eff - base) / eff * (x(b) - x(a)), height: 3, fill: "var(--ink)", opacity: .45}));
      svg.append(g);
      hover(g, () => [`${wid}${ph !== "full" ? " (" + ph.replace("_", " ") + ")" : ""}`, `${asset} · ${cat}${purpose !== "n/a" ? " · " + purpose : ""}`, `${rig} · ${sd} → ${ed}`, `base ${base} d · effective ${eff} d (+${(eff - base).toFixed(1)} weather) · sail in ${sail} d`, `winter tier: ${tier}`, (ph === "top_hole" ? "" : `value ${val.toLocaleString("en")} M ${MU()}`) + (frozen ? " · FROZEN" : "")].filter(Boolean));
    }
    wrap.replaceChildren(svg);
  };
  draw();
  const ro = new ResizeObserver(() => draw()); ro.observe(wrap);
  c.append($("div", {class: "sub", text: "Bars coloured by asset; the dark strip at the bottom of a bar is weather-added time; the line before a bar is sailing. Hover for details."}));
}

// ---------------------------------------------------------------- economics
function economics(m, v) {
  const e = v.economics, u = MU();
  const t = $("div", {class: "tiles"});
  t.append(tile("Total value", fB(e.total) + " " + u), tile("Development NPV", fB(e.npv_development) + " " + u), tile("Exploration EMV (risked)", fB(e.emv_exploration) + " " + u));
  m.append(t);
  const ys = e.yearly.filter(r => r.year <= +V().kpis.horizon_end.slice(0, 4) + 20);
  const g = $("div", {class: "two"});
  g.append(card(`Production (${v.kpis.unit_set === "NOK_Sm3" ? "million Sm³ o.e." : "million boe"} per year)`, colChart(ys.map(r => [r.year, r.boe / 1e6]), "var(--s1)", x => fN(x, 1))));
  g.append(card(`CAPEX (M ${u} per year, undiscounted)`, colChart(ys.filter(r => r.capex > 0).map(r => [r.year, r.capex / 1e6]), "var(--s2)", x => fN(x, 0))));
  m.append(g);
  m.append(card("Yearly cash flow (undiscounted, " + u + ")", table([{h: "Year", k: "year"}, {h: "Revenue (M)", n: 1, f: r => fN(r.revenue / 1e6, 0)}, {h: "OPEX (M)", n: 1, f: r => fN(r.opex / 1e6, 0)}, {h: "CAPEX (M)", n: 1, f: r => fN(r.capex / 1e6, 0)}, {h: "Oil (M " + (u === "NOK" ? "Sm³" : "bbl") + ")", n: 1, f: r => fN(r.oil / 1e6, 2)}, {h: "Gas (M " + (u === "NOK" ? "Sm³" : "MMBtu") + ")", n: 1, f: r => fN(r.gas / 1e6, 1)}], ys)));
  const g2 = $("div", {class: "two"});
  g2.append(card("Value by rig (well credited to the rig drilling its main phase)", barList(Object.entries(e.by_rig).map(([a, x]) => [a, x, "var(--s1)"]), u)));
  g2.append(card("Value by category", barList(Object.entries(e.by_category).map(([a, x]) => [a, x, "var(--s3)"]), u)));
  m.append(g2);
}
function colChart(pts, col, fmt) {
  const wrap = $("div");
  const draw = () => {
    const W = Math.max(300, wrap.clientWidth || 500), H = 220, l = 44, b = 22, tp = 8;
    const max = Math.max(...pts.map(p => p[1]), 1); const bw = (W - l - 8) / pts.length;
    const svg = S("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img"});
    for (let k = 0; k <= 4; k++) { const yv = max * k / 4, y = H - b - (H - b - tp) * k / 4; svg.append(S("line", {x1: l, x2: W - 8, y1: y, y2: y, stroke: "var(--grid)"})); const tx = S("text", {x: l - 6, y: y + 4, "text-anchor": "end"}); tx.textContent = fmt(yv); svg.append(tx); }
    pts.forEach(([lab, val], i) => {
      const h = (H - b - tp) * val / max, xx = l + i * bw + 1;
      const r = S("rect", {x: xx, y: H - b - h, width: Math.max(1, bw - 2), height: Math.max(0, h), fill: col, rx: Math.min(4, bw / 4)});
      svg.append(r); hover(r, () => [String(lab), fmt(val)]);
      if (pts.length <= 16 || i % Math.ceil(pts.length / 12) === 0) { const tx = S("text", {x: xx + bw / 2, y: H - 6, "text-anchor": "middle"}); tx.textContent = String(lab).slice(-2) === String(lab) ? lab : "'" + String(lab).slice(-2); svg.append(tx); }
    });
    wrap.replaceChildren(svg);
  };
  requestAnimationFrame(draw); new ResizeObserver(draw).observe(wrap);
  return wrap;
}

// ---------------------------------------------------------------- utilization
function util(m, v) {
  const parts = [["drilling_days", "Drilling", "var(--s1)"], ["weather_added_days", "Weather-added", "var(--s7)"], ["sailing_days", "Sailing", "var(--s4)"], ["idle_days", "Idle", "var(--grid)"], ["unavailable_days", "Unavailable", "var(--unavail)"]];
  const c = card("Rig time, plan start to horizon end (days)");
  const leg = $("div", {class: "legend"}); for (const [, n, col] of parts) leg.append($("span", {}, $("span", {class: "sw", style: `background:${col};border:1px solid var(--line)`}), document.createTextNode(n))); c.append(leg);
  for (const r of v.utilization) {
    const row = $("div", {style: "display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;margin:5px 0"});
    const tr = $("div", {style: "display:flex;height:16px;gap:2px"});
    const tot = parts.reduce((s, p) => s + r[p[0]], 0) || 1;
    for (const [k, n, col] of parts) { if (r[k] <= 0) continue; const seg = $("div", {style: `flex:${r[k] / tot};background:${col};border-radius:3px;min-width:2px`}); hover(seg, () => [r.rig_id + " – " + n, fN(r[k]) + " days"]); tr.append(seg); }
    row.append($("div", {text: r.rig_id + " " + r.name}), tr, $("div", {style: "text-align:right", text: Math.round(r.utilization * 100) + "%"}));
    c.append(row);
  }
  m.append(c);
  m.append(card("Utilization table", table([{h: "Rig", k: "rig_id"}, {h: "Name", k: "name"}, {h: "Type", k: "rig_type"}, {h: "Available", n: 1, k: "available_days"}, {h: "Drilling", n: 1, f: r => fN(r.drilling_days)}, {h: "Weather-added", n: 1, f: r => fN(r.weather_added_days)}, {h: "Sailing", n: 1, f: r => fN(r.sailing_days)}, {h: "Idle", n: 1, f: r => fN(r.idle_days)}, {h: "Unavailable", n: 1, k: "unavailable_days"}, {h: "Utilization", n: 1, f: r => Math.round(r.utilization * 100) + "%"}, {h: "Contract end", k: "contract_end"}], v.utilization)));
}

// ---------------------------------------------------------------- exploration
function expl(m, v) {
  const x = v.exploration, u = MU();
  const t = $("div", {class: "tiles"}); t.append(tile("Exploration & appraisal wells", fN(x.n_wells)), tile("Total risked value (EMV)", fM(x.risked_value) + " " + u)); m.append(t);
  const c = card("Wells spudded per year vs target range");
  const rows = x.per_year.filter(r => r.min != null || r.spudded);
  const wrap = $("div"); c.append(wrap);
  const draw = () => {
    const W = Math.max(320, wrap.clientWidth || 600), H = 200, l = 30, b = 22, tp = 10;
    const max = Math.max(...rows.map(r => Math.max(r.max || 0, r.spudded)), 1) + 1; const bw = (W - l - 8) / rows.length;
    const svg = S("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`}); const yv = q => H - b - (H - b - tp) * q / max;
    for (let k = 0; k <= max; k += Math.ceil(max / 5)) { svg.append(S("line", {x1: l, x2: W - 8, y1: yv(k), y2: yv(k), stroke: "var(--grid)"})); const tx = S("text", {x: l - 6, y: yv(k) + 4, "text-anchor": "end"}); tx.textContent = k; svg.append(tx); }
    rows.forEach((r, i) => {
      const cx = l + i * bw + bw / 2;
      if (r.min != null) { const band = S("rect", {x: cx - bw * 0.3, y: yv(r.max), width: bw * 0.6, height: yv(r.min) - yv(r.max), fill: "var(--winter)", stroke: "var(--s1)", "stroke-dasharray": "3 2", rx: 3}); svg.append(band); }
      const ok = r.status === "ok" || r.status.startsWith("at min");
      const dot = S("circle", {cx, cy: yv(r.spudded), r: 6, fill: ok ? "var(--s1)" : "var(--bad)", stroke: "var(--surface)", "stroke-width": 2}); svg.append(dot);
      hover(dot, () => [String(r.year), `${r.spudded} spudded`, r.min != null ? `target ${r.min}–${r.max} (${r.status})` : "no target"]);
      const tx = S("text", {x: cx, y: H - 6, "text-anchor": "middle"}); tx.textContent = r.year; svg.append(tx);
    });
    wrap.replaceChildren(svg);
  };
  requestAnimationFrame(draw); new ResizeObserver(draw).observe(wrap);
  c.append($("div", {class: "sub", text: "Dashed band: yearly min–max target (exploration + appraisal spuds, whole portfolio). Dot: wells spudded; red when outside the band."}));
  m.append(c);
  m.append(card("Per year", table([{h: "Year", k: "year"}, {h: "Spudded", n: 1, k: "spudded"}, {h: "Min", n: 1, k: "min"}, {h: "Max", n: 1, k: "max"}, {h: "Status", k: "status", cls: r => r.status.startsWith("below") || r.status.startsWith("above") ? "neg" : ""}], x.per_year)));
  m.append(card("Strategic wells vs windows", table([{h: "Well", k: "well_id"}, {h: "Prospect", k: "prospect"}, {h: "Window", f: r => r.window_start + " → " + r.window_end}, {h: "Scheduled", f: r => r.start_date ? r.start_date + " → " + r.end_date : ""}, {h: "Status", k: "status", cls: r => r.status === "in window" ? "pos" : "neg"}], x.strategic)));
}

// ---------------------------------------------------------------- weather
function weather(m, v) {
  const u = MU();
  m.append(card("Wells placed in winter (≥ 50 % of their days in winter months), by tier", table([
    {h: "Winter", k: "season"}, {h: "none", n: 1, f: r => r.counts.none}, {h: "avoid", n: 1, f: r => r.counts.avoid}, {h: "strongly avoid", n: 1, f: r => r.counts.strongly_avoid, cls: r => r.counts.strongly_avoid ? "warnc" : ""},
    {h: "Weather-added days", n: 1, f: r => fN(r.weather_added_days)}, {h: `Winter penalty (M ${u})`, n: 1, f: r => fN(r.penalty / 1e6, 1)},
    {h: "strongly_avoid wells in winter", f: r => r.wells.strongly_avoid.map(w => w.well_id + (w.frozen ? "*" : "")).join(", ")}], v.weather)));
  m.append($("div", {class: "sub", text: "* frozen assignment (not moved by the optimizer). Weather-added days are counted for every phase that touches a winter month."}));
}

// ---------------------------------------------------------------- campaigns
function batch(m, v) {
  for (const c of v.campaigns) {
    m.append(card(`${c.campaign} · ${c.installation}` + (c.status === "scheduled" ? ` · conductor rig ${c.rig_id} · ${c.start} → ${c.end}` : " · not scheduled"),
      table([{h: "Well", k: "well_id"}, {h: "Top hole", f: r => r.top_hole_start + " → " + r.top_hole_end}, {h: "Main rig", k: "main_rig"}, {h: "Main phase", f: r => r.main_start + " → " + r.main_end}, {h: "Gap (days)", n: 1, k: "gap_days"}, {h: "Same rig", f: r => r.same_rig ? "yes" : "no"}], c.wells)));
  }
}

// ---------------------------------------------------------------- unscheduled
function uns(m, v) {
  const cnt = {}; v.unscheduled.forEach(r => cnt[r.reason] = (cnt[r.reason] || 0) + 1);
  const t = $("div", {class: "tiles"}); for (const [k, n] of Object.entries(cnt)) t.append(tile(k.replaceAll("_", " "), fN(n), "wells")); m.append(t);
  m.append(card("Wells not scheduled, with reason", table([{h: "Well", k: "well_id"}, {h: "Asset", k: "asset"}, {h: "Category", k: "category"}, {h: "Purpose", k: "purpose"}, {h: "Mandatory", f: r => r.mandatory ? "yes" : ""}, {h: "Reason", k: "reason"}, {h: "Detail", k: "detail"}, {h: `Value at earliest start (M ${MU()})`, n: 1, f: r => fN(r.ideal_value / 1e6, 1)}], v.unscheduled)));
}

// ---------------------------------------------------------------- risk
function risk(m, v) {
  const u = MU();
  if (v.monte_carlo) {
    const mc = v.monte_carlo; const t = $("div", {class: "tiles"});
    t.append(tile("Deterministic value", fB(mc.deterministic) + " " + u), tile("P10 value", fB(mc.value_p10) + " " + u), tile("P50 value", fB(mc.value_p50) + " " + u), tile("P90 value", fB(mc.value_p90) + " " + u));
    m.append(t);
    m.append(card(`Start-date uncertainty (Monte Carlo, ${mc.samples} samples)`, $("div", {class: "sub", text: mc.note}), table([{h: "Well", k: "well_id"}, {h: "Planned start", k: "planned"}, {h: "P10", k: "p10"}, {h: "P50", k: "p50"}, {h: "P90", k: "p90"}], mc.wells)));
  }
  if (v.discovery_risk) {
    m.append(card("Discovery risk: knock-on if an exploration well finds hydrocarbons", table([
      {h: "Exploration well", k: "well_id"}, {h: "Rig", k: "rig_id"}, {h: "Start", k: "start_date"}, {h: "Extra days", n: 1, k: "extra_days"},
      {h: "Wells delayed", n: 1, k: "n_delayed"}, {h: "Max delay (d)", n: 1, k: "max_delay_days"},
      {h: `Value effect on other wells (M ${u})`, n: 1, f: r => fN(r.value_impact_other_wells / 1e6, 1)},
      {h: "Delayed wells", f: r => r.delayed.map(d => `${d.well_id} (${d.rig_id}, +${d.days} d)`).join(", ")}], v.discovery_risk)));
  }
  if (!v.monte_carlo && !v.discovery_risk) m.append(card("Risk", $("div", {class: "sub", text: "Risk analysis is run for optimized variants only."})));
}

// ---------------------------------------------------------------- diff
function diff(m, v) {
  if (!v.comparison) { m.append(card("Changes", $("div", {class: "sub", text: "This is the reference schedule."}))); return; }
  const c = v.comparison, u = MU(); const t = $("div", {class: "tiles"});
  t.append(tile("Value change vs reference", (c.value_delta >= 0 ? "+" : "") + fM(c.value_delta) + " " + u, "", c.value_delta >= 0 ? "pos" : "neg"));
  for (const k of ["moved", "rig change", "added", "dropped"]) t.append(tile(k, fN(c.counts[k] || 0), "wells"));
  t.append(tile("Mean |shift|", fN(c.mean_abs_shift_days) + " d", `max ${c.max_abs_shift_days} d`));
  m.append(t);
  m.append(card("Differences against the reference schedule", table([{h: "Well", k: "well_id"}, {h: "Change", k: "change"}, {h: "From", f: r => (r.from_rig || "") + " " + (r.from_start || "")}, {h: "To", f: r => (r.to_rig || "") + " " + (r.to_start || "")}, {h: "Shift (d)", n: 1, k: "shift_days"}, {h: `Value Δ (M ${u})`, n: 1, f: r => fN(r.value_delta / 1e6, 1), cls: r => r.value_delta >= 0 ? "pos" : "neg"}], c.rows)));
}
render();
</script>
